<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Design</title>

  <style>
    :root {
      --bg-color: #030712;
      --border-color: rgb(66, 66, 66);
    }

    * {
      padding: 0;
      margin: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      width: 100vw;
      color: #ffffff;
    }

    header {
      width: 100%;
      height: 20px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-content: center;
    }

    header .logo {
      margin-left: 16px;
      height: 100%;
    }

    .logo img {
      height: 100%;
    }

    nav {
      margin-right: 16px;
    }

    nav ul {
      display: flex;
      gap: 16px;
    }

    nav ul li {
      list-style: none;
    }

    nav ul li a {
      text-decoration: none;
      color: #ffffff;
    }

    .manu {
      position: absolute;
      top: 15px;
      right: 10px;
      padding: 4px;
      width: min-content;
      background-color: rgba(71, 71, 71, 0.511);
      border-radius: 8px;
      cursor: pointer;
      display: none;
    }

    main {
      margin: 4rem 3rem;
    }

    h1 {
      font-size: 4rem;
    }

    .btn {
      padding: 8px;
      border-radius: 16px;
      background-color: #ffffff30;
      cursor: pointer;
      border: none;
      color: #ffffff;
    }

    p {
      margin: 16px 0;
      color: #ffffff76;
      font-size: 1rem;
    }

    .blue-tag span {
      color: rgb(0, 117, 213);
    }

    #toggle {
      display: none;
    }

    @media (max-width: 500px) {
      .phone-nav {
        flex-direction: column;
        display: none;
        position: absolute;
        top: 60px;
        right: 10px;
        background-color: var(--bg-color);
        padding: 8px;
        border: var(--border-color) 1px solid;
      }

      .manu {
        display: block;
      }

      main {
        margin: 2rem 1.5rem;
      }

      a .btn {
        width: 100%;
      }

      #toggle:checked+.manu+.phone-nav {
        display: flex;
      }

      h1 {
        font-size: 2rem;
      }

    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="https://tailwindcss.com/">
      <img src="https://tailwindcss.com/_next/static/media/tailwindcss-logotype-white.541819ec.svg" alt="tailwind logo">
    </a>
    <nav>
      <input type="checkbox" id="toggle">
      <label class="manu" for="toggle"><span>manu</span></label>
      <ul class="phone-nav">
        <li><a href="https://tailwindcss.com/docs">Docs</a></li>
        <li><a href="https://tailwindcss.com/blog">Blog</a></li>
        <li><a href="https://tailwindcss.com/showcase">Showcase</a></li>
        <li><a href="https://tailwindcss.com/sponsor">Sponsor</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Rapidly build modern websites without ever leaving your HTML</h1>
    <p class="blue-tag">A utility-first CSS framework packed with classes like <span>flex</span>, <span>pt-4</span>,
      <span>text-center</span> and <span>rotate-90</span> that can be composed to build any design, directly in your
      markup.
    </p>
    <div>
      <a href="https://tailwindcss.com/docs/installation"><button class="btn">Get started</button></a>
    </div>
  </main>
</body>

</html>
